services:
  # 灰度偏移 d 的判定保持区间演示（主页面，http://localhost:8000）
  crack-sweep:
    build: .
    image: crack-sweep:latest
    container_name: crack-sweep
    command: ["uvicorn", "app.web:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  # 原有的边缘分块尺寸选型演示（http://localhost:8001）
  crack-tiling:
    build: .
    image: crack-sweep:latest
    container_name: crack-tiling
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
